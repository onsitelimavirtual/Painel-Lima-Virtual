function listLessons(){let ls=lessons();return topText('Biblioteca orientada','Biblioteca ampliada V2.5','Aprendizagem por habilidade: teoria orientada, exemplos, prática guiada, mapa mental e desafio com devolutiva.')+`<div class="panel"><div class="flex between"><div><strong>Etapa:</strong> ${state.etapa==='Médio'?'Ensino Médio':'Fundamental II'}</div><button class="btn outline small" data-action="change-stage">Alternar etapa</button></div><div class="tabs">${['Todas',...new Set(LAB.map(x=>x.area))].map(a=>`<button class="tab ${state.area===a?'selected':''}" data-action="set-area" data-area="${a}">${a}</button>`).join('')}</div><input class="search" id="filterLessons" placeholder="Buscar trilhas por assunto..." aria-label="Pesquisar trilhas"><p class="small muted" style="margin:10px 0 0">${ls.length} trilhas nesta seleção. Conteúdos editoriais complementares: respostas conferíveis e revisão pedagógica humana recomendada.</p></div><div id="lessonList" class="section grid">${ls.map(cardLesson).join('')}</div>`;}
function lessonDetails(l){if(!l)return listLessons();const s=stats(l.id);return `<div class="crumb"><button data-nav="trilhas">← Trilhas</button> / ${txt(l.area)}</div><div class="panel"><div class="lesson-head"><div><span class="eyebrow">${txt(l.area)} · ${txt(l.etapa)} · nível ${l.nivel}</span><h1>${l.icone} ${txt(l.titulo)}</h1><p>${txt(l.objetivo)}</p>${scoreTag(l)}</div><div class="lesson-icon" aria-hidden="true">${l.icone}</div></div><div class="notice"><strong>Você já precisa conhecer:</strong> ${txt(l.previo)}</div><div class="grid two section"><section><h2>📖 Entenda em poucas palavras</h2><p>${txt(l.teoria)}</p><h3>Exemplo resolvido</h3><div class="notice safe">${txt(l.exemplo)}</div></section><section><h2>🧩 Passo a passo</h2><ol class="steps">${l.passos.map(p=>`<li>${txt(p)}</li>`).join('')}</ol></section></div><div class="grid two section"><div><h3>✏️ Prática guiada</h3><p>${txt(l.pratica)}</p></div><div><h3>🌍 Aplicação fora da escola</h3><p>${txt(l.aplicacao)}</p></div></div><div class="buttons"><button class="btn" data-action="begin" data-id="${l.id}">Fazer desafio de 4 perguntas →</button><button class="btn ghost" data-action="go-map" data-id="${l.id}">Mapa mental</button><button class="btn outline" data-action="go-flash" data-id="${l.id}">Flashcards</button><button class="btn outline" data-action="go-tutor" data-id="${l.id}">Tutor deste assunto</button></div>${s.latest?`<p class="small muted subtle">Último desempenho: ${s.latest.score} de ${s.latest.total} respostas corretas. ${s.mastered?'Você alcançou 75% em alguma rodada.':'Uma nova tentativa pode ajudar.'}</p>`:''}</div>`;}
function shuffle(ar){let a=[...ar];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(id){let l=byId(id);if(!l)return;runtime.selected=id;runtime.active={id,order:shuffle([0,1,2,3]),at:0,correct:0,firstAnswers:[],idTime:Date.now()};runtime.feedback=null;nav('questao');}
function question(){let a=runtime.active;if(!a){nav('trilhas');return '';}let l=byId(a.id),q=l.q[a.order[a.at]],fb=runtime.feedback;return `<div class="crumb"><button data-action="abandon">← Voltar à trilha</button> · ${txt(l.titulo)}</div><div class="panel question-card"><div class="flex between"><span class="eyebrow">Prática + feedback</span><span class="state-badge">Questão ${a.at+1} de ${a.order.length}</span></div><div class="progressbar" aria-label="Progresso do desafio"><span style="width:${a.at/a.order.length*100}%"></span></div><p class="question">${txt(q[0])}</p><div class="answers" role="group" aria-label="Escolha uma alternativa">${q[1].map((o,i)=>`<button class="answer ${fb?(i===q[2]?'correct':i===fb.chosen?'wrong':''):''}" data-action="answer" data-index="${i}" ${fb?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${txt(o)}</span></button>`).join('')}</div>${fb?`<div class="explanation ${fb.isRight?'':'error'}" role="status"><strong>${fb.isRight?'✅ Muito bem!':'🔎 Vamos entender esse passo.'}</strong><p>${txt(q[4])}</p>${!fb.isRight?`<div class="small">Pista para revisar: ${txt(q[3])}</div>`:''}</div><div class="buttons"><button class="btn" data-action="next">${a.at+1===a.order.length?'Concluir rodada':'Próxima questão →'}</button></div>`:`<div class="buttons"><button class="btn ghost small" data-action="hint">Quero uma pista 💡</button><button class="btn outline small" data-action="read">🔊 Ler questão</button></div><div id="hint" aria-live="polite"></div>`}<p class="small muted subtle">Treino sem punição: seu resultado ajuda a recomendar a próxima revisão.</p></div>`;}

const STOPWORDS=new Set('a o as os de da do das dos e em um uma por para com no na nos nas que qual como onde quando eu voce me meu minha sobre explica explique preciso quero pode tem ser mais menos isso agora nesta este essa desse estudar saber aprender significa seria favor voce pode qual quando onde porque ter fazer dar diga mostrar diga assunto conte fale quero saber queria entender uma duvida duvidas sou estamos nossa'.split(' '));
const fmt=n=>Number(n.toFixed(6)).toLocaleString('pt-BR',{maximumFractionDigits:6});
const words=s=>norm(s).replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(t=>t.length>=3&&!STOPWORDS.has(t));
const wordset=s=>new Set(words(s));
const INDEX=LAB.map(l=>{
 const heading=wordset(l.titulo), aliases=(l.termos||[]).map(norm), tags=wordset([l.titulo,l.objetivo,...(l.termos||[]),...l.mapa,...l.cards.map(c=>c[0])].join(' ')), supporting=wordset([l.teoria,l.exemplo,l.aplicacao,...l.cards.map(c=>c[1])].join(' '));
 return {l,heading,aliases,tags,supporting};
});
const df=new Map();for(const entry of INDEX){for(const token of new Set([...entry.tags,...entry.supporting]))df.set(token,(df.get(token)||0)+1);}
function findLesson(utterance){
 const lower=norm(utterance).trim(), terms=[...new Set(words(lower))];if(!terms.length)return null;
 let ranked=INDEX.map(entry=>{
  const matched=terms.filter(t=>entry.heading.has(t)||entry.tags.has(t)||entry.supporting.has(t));
  let score=0;
  if(lower.includes(norm(entry.l.titulo))&&entry.l.titulo.length>=5)score+=38;
  for(const alias of entry.aliases){if(alias.length>=5&&lower.includes(alias))score+=16;}
  for(const t of terms){
   const rarity=Math.max(0.6, Math.log((INDEX.length+1)/((df.get(t)||0)+1)));
   if(entry.heading.has(t))score+=7*rarity;
   else if(entry.tags.has(t))score+=3.1*rarity;
   else if(entry.supporting.has(t))score+=1.4*rarity;
  }
  return {l:entry.l,score,matched};
 }).sort((a,b)=>b.score-a.score);
 let best=ranked[0],runner=ranked[1];
 if(!best||best.score<8)return null;
 // Não responder sobre uma informação sem cobertura por associação fraca com tema amplo.
 if(best.score<18&&runner&&best.score-runner.score<4)return null;
 if(best.matched.length===1&&best.score<16)return null;
 return best.l;
}
function arithmeticAnswer(text){
 let q=norm(text).trim(),m;
 const val=t=>Number(t.replace(',','.'));
 if((m=q.match(/(-?\d{1,8}(?:[.,]\d{1,3})?)\s*%\s*de\s*(-?\d{1,9}(?:[.,]\d{1,3})?)/))){
  let rate=val(m[1]),total=val(m[2]);if(Math.abs(rate)>10000||Math.abs(total)>1e9)return null;
  let result=rate*total/100;
  return `${fmt(rate)}% de ${fmt(total)} = ${fmt(result)}.\nMétodo: (${fmt(rate)} ÷ 100) × ${fmt(total)} = ${fmt(result)}.\nConferência: 100% corresponderia a ${fmt(total)}. Para descontos, subtraia a parte do preço original; para acréscimos, some.`;
 }
 // Operações básicas com limites numéricos; expressões maiores não são interpretadas.
 if((m=q.match(/(?:^|quanto e\s*|quanto vale\s*|calcule\s*|resolva\s*)(-?\d{1,6}(?:[.,]\d{1,2})?)\s*(\+|\*|×|÷|\/)\s*(-?\d{1,6}(?:[.,]\d{1,2})?)(?:\s*[?!.]?\s*$)/))){
  let a=val(m[1]),b=val(m[3]),op=m[2],n;
  if(op==='+')n=a+b;else if(op==='*'||op==='×')n=a*b;else{if(!b)return 'Não é possível dividir por zero. Escolha um divisor diferente de zero.';n=a/b;}
  if(Number.isFinite(n))return `${fmt(a)} ${op} ${fmt(b)} = ${fmt(n)}.\nConferência: ${op==='+'?'subtraia uma parcela do resultado para obter a outra':op==='*'||op==='×'?'divida o produto por um dos fatores, quando for diferente de zero':'multiplique o quociente pelo divisor para recuperar o dividendo'}.`;
 }
 if((m=q.match(/(\d{1,4})\s*\/\s*(\d{1,4})\s*([+-])\s*(\d{1,4})\s*\/\s*(\d{1,4})/))){
  let a=+m[1],b=+m[2],c=+m[4],d=+m[5];if(!b||!d)return 'O denominador de uma fração deve ser diferente de zero.';
  let num=m[3]==='+'?a*d+c*b:a*d-c*b,den=b*d,aa=Math.abs(num),bb=den;while(bb){[aa,bb]=[bb,aa%bb];}let g=aa||1;
  return `${a}/${b} ${m[3]} ${c}/${d} = ${num}/${den}${g>1?` = ${num/g}/${den/g}`:''}.\nPasso 1: use denominadores compatíveis: (${a}×${d})/${den} ${m[3]} (${c}×${b})/${den}.\nPasso 2: opere os numeradores e simplifique pela divisão por ${g}.`;
 }
 if((m=q.match(/(?:^|[^\w])(-?\d{1,3})\s*\*?\s*x\s*([+-])\s*(\d{1,6})\s*=\s*(-?\d{1,7})(?!\w)/))){
  let a=+m[1],b=+m[3]*(m[2]==='-'?-1:1),c=+m[4];if(!a)return 'O coeficiente de x é zero; não é possível dividir por zero. Confira a igualdade e as constantes.';
  let x=(c-b)/a;
  return `Equação: ${fmt(a)}x ${b<0?'−':'+'} ${fmt(Math.abs(b))} = ${fmt(c)}.\n1. ${fmt(a)}x = ${fmt(c-b)}.\n2. x = (${fmt(c-b)}) ÷ (${fmt(a)}) = ${fmt(x)}.\n3. Verificação: ${fmt(a*x+b)} = ${fmt(c)}. A solução é ${fmt(x)}.`;
 }
 if((m=q.match(/(?:^|[^\w])x\s*([+-])\s*(\d{1,6})\s*=\s*(-?\d{1,7})(?!\w)/))){
  const b=+m[2]*(m[1]==='-'?-1:1),c=+m[3],x=c-b;
  return `Isole x fazendo a operação inversa: x = ${fmt(c)} ${b<0?'+':'−'} ${fmt(Math.abs(b))} = ${fmt(x)}.\nConferência: ${fmt(x)} ${b<0?'−':'+'} ${fmt(Math.abs(b))} = ${fmt(c)}.`;
 }
 if((m=q.match(/(?:quanto e|quanto vale|calcule|potencia de|^)(?:\s*)(\d{1,3})\s*(?:\^|\*\*)\s*(\d{1,2})(?:\s|\?|$)/))){
  let a=+m[1],b=+m[2];if(b>12||a>99)return null;
  let r=a**b;if(!Number.isSafeInteger(r))return null;
  return `${a} elevado a ${b} = ${fmt(r)}.\nMultiplique a base por ela mesma ${b} vez(es), ou use a regra do expoente zero se b = 0. Conferência: ${a}^${b} = ${r}.`;
 }
 if((m=q.match(/(?:raiz quadrada|√)\s*(?:de\s*)?(\d{1,8})(?:\s|\?|$)/))){
  let n=+m[1],r=Math.sqrt(n);if(!Number.isInteger(r))return `A raiz quadrada principal de ${n} é aproximadamente ${fmt(r)}. Ao elevar esse valor ao quadrado, você se aproxima de ${n}.`;
  return `√${n} = ${r}, porque ${r} × ${r} = ${n}. Aqui usamos a raiz principal, não negativa.`;
 }
 if((m=q.match(/\b(mmc|mdc)\s*(?:de\s*)?(\d{1,5})\s*(?:e|,|\s)\s*(\d{1,5})/))){
  let a=+m[2],b=+m[3];if(a<1||b<1)return null;
  let x=a,y=b;while(y){[x,y]=[y,x%y];}let r=m[1]==='mdc'?x:a/x*b;
  return `${m[1].toUpperCase()}(${a}, ${b}) = ${r}.\nO MDC é o maior divisor comum; o MMC é o menor múltiplo positivo comum. Confira pelos divisores ou múltiplos dos dois números.`;
 }
 if((m=q.match(/\b(?:media|media aritmetica)\s+de\s+((?:\d{1,5}(?:[.,]\d{1,2})?\s*(?:,|;|e)\s*){1,7}\d{1,5}(?:[.,]\d{1,2})?)/))){
  let parts=m[1].split(/\s*(?:;|\be\b|,\s+)\s*/).filter(Boolean);

 }
 return null;
}
function sayToTutor(user){
 const q=norm(user.trim());if(!q)return 'Escreva uma dúvida ou escolha uma explicação guiada.';
 // Segurança e convivência vêm antes de buscas e contas.
 const risk=[...R].reverse().find(r=>r.termos.some(t=>q.includes(norm(t))));if(risk)return risk.resposta;
 if(/^(oi|ola|bom dia|boa tarde|boa noite)(\b|[!,.])/.test(q))return 'Olá! Escolha um tema ou descreva o que não entendeu. Podemos estudar com um exemplo, uma pista ou um desafio no seu ritmo.';
 const computed=arithmeticAnswer(user);if(computed)return computed+'\n\nFonte: cálculo determinístico local, com passos de conferência.';
 const found=findLesson(user),focused=byId(runtime.topic)||lessons()[0];
 const isFollowup=/^(me da|me de|mostre|outro|outros|pode|preciso|quero|explique|exemplo|passo|praticar|aplicacao|ainda nao entendi|nao entendi|e como|como faz|mais um exemplo)(\b|$)/.test(q)&&words(q).length<=5;
 if(!found&&!isFollowup){return 'Não encontrei referência suficiente na biblioteca para responder com precisão. Tente escrever o assunto completo (por exemplo: MMC, regra de três, fotossíntese, interpretação de texto ou simple past) ou converse com seu professor. Não vou inventar uma resposta.';}
 const ref=found||focused;if(found)runtime.topic=found.id;
 const source=`\n\n📚 Fonte: biblioteca local, trilha “${ref.titulo}” (${ref.area}). Material complementar, sujeito à revisão pedagógica.`;
 if(/(plano de revisao|roteiro de revisao|o que revisar)/.test(q))return `Roteiro de revisão — ${ref.titulo}:\n1. Conceito: ${ref.teoria}\n2. Exemplo: ${ref.exemplo}\n3. Treino: ${ref.pratica}\n4. Volte para rever os flashcards mais tarde.`+source;
 if(/(erros comuns|onde errei|por que errei|porque errei)/.test(q))return `Para entender erros em ${ref.titulo}, compare o que a questão pede com a resposta esperada.\nQuestão: ${ref.q[0][0]}\nResposta: ${ref.q[0][1][ref.q[0][2]]}.\nVeja também: ${ref.exemplo}`+source;
 if(/(outra explicacao|de outra maneira|outro caminho)/.test(q))return `Por outro caminho em ${ref.titulo}:\n1. Imagine: ${ref.exemplo}\n2. Identifique a ideia principal: ${ref.teoria}\n3. Teste o entendimento: ${ref.q[0][0]}`+source;

 if(/(passo|como faz|como resolv|me ensina|procedimento)/.test(q))return `Vamos resolver por etapas — ${ref.titulo}:\n${ref.passos.map((p,i)=>`${i+1}. ${p}`).join('\n')}\nExemplo: ${ref.exemplo}`+source;
 if(/(outro exemplo|exemplo|mostr|demonstra)/.test(q))return `Exemplo sobre ${ref.titulo}:\n${ref.exemplo}\n\nAgora tente esta aplicação: ${ref.pratica}`+source;
 if(/(pratic|exercic|desafio|questao|trein)/.test(q))return `Vamos praticar ${ref.titulo}:\n${ref.pratica}\n\nPista: ${ref.passos[0]}\nPara verificar seu aprendizado, abra a trilha e faça o desafio corrigido.`+source;
 if(/(aplic|util|serve|futuro|vida real|profiss)/.test(q))return `No cotidiano, ${ref.titulo.toLowerCase()} pode ajudar em: ${ref.aplicacao}\n\nEscolha uma situação real e descreva onde aplicaria a ideia.`+source;
 if(/(nao entendi|confus|dificuldade|erro)/.test(q))return `Podemos tentar por outro caminho em ${ref.titulo}:\n1. ${ref.passos[0]}\n2. Observe: ${ref.exemplo}\n3. Tente: ${ref.pratica}\nSe continuar difícil, diga qual etapa deixou dúvida.`+source;
 return `${ref.titulo}\n${ref.teoria}\n\nExemplo explicado: ${ref.exemplo}\n\nVocê prefere um mapa mental, flashcards ou um desafio?`+source;
}

function tutorCommand(com){
 let l=byId(runtime.topic)||lessons()[0],last=stats(l.id).latest;
 const source='\n\n📚 Fonte: '+l.titulo+' · biblioteca pedagógica local. Verificação humana recomendada.';
 let responses={
 explique:`${l.titulo}\n${l.teoria}\nPré-requisito: ${l.previo}`,
 exemplo:`Exemplo resolvido:\n${l.exemplo}`,
 passos:`${l.passos.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\nExemplo: ${l.exemplo}`,
 pratica:`Prática guiada:\n${l.pratica}\n\nPergunta de verificação: ${l.q[0][0]}`,
 aplicacao:`Aplicações reais:\n${l.aplicacao}`,
 outro:`Outra forma de estudar ${l.titulo}:\n1. Comece por uma situação concreta: ${l.exemplo}\n2. Extraia a regra: ${l.teoria}\n3. Transfira para sua vida: ${l.aplicacao}\n\nQual desses passos pareceu mais difícil?`,
 erros:`Possíveis confusões no tema ${l.titulo}:\n• Responder outra pergunta, e não o enunciado.\n• Trocar conceitos próximos.\n• Não conferir a resposta com um exemplo.\n\nVerificação: ${l.q[0][0]}\nResposta correta: ${l.q[0][1][l.q[0][2]]}.\nConfira o exemplo da trilha para compreender o motivo.`,
 revisao:`Roteiro breve de recuperação — ${l.titulo}:\n1. Revise o conceito e o exemplo, com calma.\n2. Tente explicar sem olhar a resposta.\n3. Resolva as quatro questões com feedback.\n4. Use os flashcards e volte ao tema em outro dia.\n${last?'Última rodada registrada: '+last.score+' acertos em '+last.total+' questões.':'Nenhuma rodada registrada neste tema até o momento.'}\nA sugestão não substitui acompanhamento do professor.`
 };
 runtime.tutor.push({role:'bot',text:(responses[com]||responses.explique)+source});if(runtime.tutor.length>24)runtime.tutor.splice(1,2);renderChat();
}

function futurePage(){let selected=FUT.find(f=>f.id===runtime.futureId)||FUT[0];return topText('Construção do Futuro','Meu futuro, minhas possibilidades','Conhecimento, escolhas e projeto de vida. Seu futuro não depende de uma nota isolada.')+`<div class="future-art"><span class="symbol" role="img" aria-label="Estrela e caminho">🌟🛤️</span><div><h2>Aprender hoje abre novas portas.</h2><p>Conhecer seus interesses, melhorar um conhecimento e pedir ajuda quando necessário são maneiras reais de construir possibilidades. Sem promessas de sucesso garantido nem cobranças exageradas.</p></div></div><div class="section grid two"><div class="panel"><h2>Escolha uma missão</h2>${FUT.map(f=>`<button class="answer ${selected.id===f.id?'correct':''}" data-action="future-select" data-id="${f.id}" style="width:100%;margin-bottom:8px"><span class="letter" aria-hidden="true">${f.icone}</span><span>${txt(f.titulo)} ${state.doneFuture.includes(f.id)?'✅':''}</span></button>`).join('')}</div><div class="panel"><span class="eyebrow">${txt(selected.habilidade)}</span><h2>${selected.icone} ${txt(selected.titulo)}</h2><p>${txt(selected.descricao)}</p><ol class="steps">${selected.passos.map(p=>`<li>${txt(p)}</li>`).join('')}</ol><div class="notice safe">${txt(selected.reflexao)}</div><label for="futureNotes"><strong>Rascunho de reflexão (não é salvo):</strong></label><textarea id="futureNotes" class="work-field" maxlength="1500" placeholder="Escreva sua ideia, se quiser..."></textarea><div class="buttons"><button class="btn" data-action="future-done" data-id="${selected.id}">${state.doneFuture.includes(selected.id)?'✓ Missão concluída':'Marcar como concluída'}</button><button class="btn outline" data-action="future-print">🖨️ Imprimir reflexão</button></div></div></div><div class="notice warm">🧭 Quando estudar parecer difícil, pense em uma ação de poucos minutos. Resistência escolar pode ter várias causas; esta ferramenta não identifica causas clínicas nem substitui a escuta cuidadosa da escola e da família.</div>`;}
function progressPage(){let all=state.attempts,accuracy=all.reduce((n,a)=>n+a.score,0),total=all.reduce((n,a)=>n+a.total,0);return topText('Acompanhamento transparente','Seu progresso local','Registros de prática e pontos: não são notas oficiais nem avaliação clínica.')+`<div class="stats"><div class="stat"><span class="number">${all.length}</span><small>rodadas</small></div><div class="stat"><span class="number">${total?Math.round(accuracy/total*100):'—'}${total?'%':''}</span><small>acerto nas rodadas</small></div><div class="stat"><span class="number">${doneCount()}/${LAB.length}</span><small>trilhas com êxito</small></div><div class="stat"><span class="number">${totalPoints()}</span><small>pontos da jornada</small></div></div><section class="section panel"><h2>Histórico de habilidades</h2>${all.length?`<div style="overflow-x:auto"><table class="report"><thead><tr><th>Assunto</th><th>Rodadas</th><th>Último desempenho</th><th>Estado</th></tr></thead><tbody>${LAB.filter(l=>rounds(l.id).length).map(l=>{let s=stats(l.id);return `<tr><td>${txt(l.titulo)}</td><td>${s.sessions}</td><td>${s.latest.score}/${s.latest.total}</td><td>${s.mastered?'Bom resultado na última rodada':'Em construção'}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">Ainda sem histórico. Conclua sua primeira rodada de quatro questões!</div>'}</section><section class="section grid two"><div class="panel"><h2>Seus dados, sob seu controle</h2><p>O histórico é guardado exclusivamente neste navegador. Você pode fazer um arquivo de backup JSON, restaurar e apagar todos os registros.</p><div class="buttons"><button class="btn" data-action="export">Exportar progresso</button><button class="btn outline" data-action="import">Importar backup</button><button class="btn warn" data-action="reset">Apagar histórico</button></div><input type="file" id="importFile" hidden accept="application/json,.json" aria-label="Arquivo de backup JSON"></div><div class="panel"><h2>Convivência e aprendizagem</h2><p>Resultados em tela não definem capacidade pessoal. Se uma dificuldade persistir, leve o conteúdo à escola e procure orientações de educadores e responsáveis.</p><div class="notice safe">Acesso offline, sem contas nem compartilhamento automático.</div></div></section>`;}
function privacy(){return `<div class="legalcopy"><p><strong>Meu Reforço Favorito — V2.5</strong> · © 2026 Nailson Rodrigues de Lima. Este texto é um modelo preliminar para revisão jurídica.</p><h3>1. Termos de Uso</h3><p>O sistema é uma ferramenta educacional complementar para adolescentes, professores e responsáveis, especialmente para recuperação de aprendizagens. Oferece conteúdos locais, quizzes, mapas mentais, flashcards, tutoria por regras e Projeto de Vida. Não substitui professor, escola, avaliação oficial ou acompanhamento psicológico, psicopedagógico ou médico. Não promete aumento de notas, aprovação, renda ou emprego.</p><p>A licença comercial, quando contratada, depende de instrumento separado que defina preço, prazo, número de dispositivos, suporte e reembolso. Este aceite local é um registro de ciência das condições educacionais e de privacidade, não é contrato de compra e venda.</p><h3>2. Política de Privacidade</h3><p>O aplicativo não exige nome, e-mail, CPF, fotografia, localização ou conta. Progresso, preferências e missões ficam no armazenamento local deste navegador; a conversa do tutor não é persistida. Nenhum dado de atividades é transmitido pelo aplicativo offline ao desenvolvedor. Não há anúncios, telemetria, publicidade comportamental nem bibliotecas de rastreamento nesta versão.</p><p>Em dispositivo compartilhado, o histórico poderá ser visto por outras pessoas que usem o mesmo navegador. Backup e comprovante só deixam o dispositivo quando exportados e compartilhados pelo próprio usuário. É possível apagar o histórico, e o aceite local, pelo botão de exclusão. O responsável deve orientar o estudante a não inserir dados pessoais sensíveis no campo de perguntas.</p><h3>3. Segurança de adolescentes</h3><p>O sistema não faz diagnósticos, não substitui atendimentos de emergência e não deve aconselhar isolamento, discriminação ou exposição de dados. Situações de violência, risco ou sofrimento significativo exigem apoio de adultos e profissionais competentes. Se forem acrescentados hospedagem, login, pagamento, IA externa ou perfilamento, será preciso revisar conformidade com LGPD e ECA Digital antes da publicação.</p><h3>4. Direitos, dados e limitações</h3><p>Conteúdos pedagógicos são materiais complementares, não uma reprodução integral da BNCC. Questões e respostas devem passar por validação pedagógica humana antes de implantação institucional ampla. A autoria deste aplicativo é indicada acima; marcas de terceiros são mencionadas apenas para referência educacional. A aplicação é fornecida no estado atual, sem garantia de adequação a todas as necessidades de aprendizagem.</p><h3>5. Registro do aceite</h3><p>O aceite grava apenas perfil declarado, versão dos termos e data/hora do dispositivo. Isso não verifica identidade, idade, vínculo de guarda, autoria, assinatura avançada nem cria comprovante com fé pública. Crianças e adolescentes devem utilizar sob orientação adequada.</p><p><strong>Referências informativas:</strong> <a href="https://basenacionalcomum.mec.gov.br/" target="_blank" rel="noopener noreferrer">BNCC/MEC</a> · <a href="https://www.gov.br/anpd/pt-br/assuntos/eca-digital" target="_blank" rel="noopener noreferrer">ANPD / ECA Digital</a>.</p></div>`;}

 $('#confirmConsent').onclick=()=>{let perfil=$('#consentRole').value;if(!perfil||!$('#consentCheck').checked){toast('Selecione o perfil e confirme a leitura.');return;}localAcceptance={version:DOC_VERSION,perfil,aceitoEm:Date.now()};try{localStorage.setItem(CONTRACT_KEY,JSON.stringify(localAcceptance));}catch(e){toast('O navegador não permitiu salvar o aceite; apenas a sessão atual ficará registrada.');}hideModal(true);nav('inicio');toast('Ciência registrada localmente. Bom estudo!');};}

case 'read':{if('speechSynthesis' in window){let a=runtime.active,q=byId(a.id).q[a.order[a.at]];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(`${q[0]}. ${q[1].map((s,i)=>'Alternativa '+('ABCD'[i])+': '+s).join('. ')}`);u.lang='pt-BR';u.rate=.92;speechSynthesis.speak(u);}else toast('Leitura em voz não disponível neste navegador.');return;}
case 'go-map':runtime.mapId=id;return nav('mapas');case 'go-flash':runtime.topic=id;runtime.flashIndex=0;runtime.flipped=false;return nav('flashcards');case 'go-tutor':runtime.topic=id;return nav('tutor');case 'set-area':state.area=button.dataset.area;save();return render();case 'change-stage':state.etapa=state.etapa==='Fundamental'?'Médio':'Fundamental';state.area='Todas';save();return render();
case 'flash-next':runtime.flashIndex=Math.min((byId(runtime.topic)?.cards.length||1)-1,runtime.flashIndex+1);runtime.flipped=false;return render();case 'flash-prev':runtime.flashIndex=Math.max(0,runtime.flashIndex-1);runtime.flipped=false;return render();case 'flash-flip':runtime.flipped=!runtime.flipped;return render();case 'tutor-command':return tutorCommand(button.dataset.command);case 'tutor-feeling':{let options={'sem vontade':'odeio estudar','confuso':'não consigo aprender','medo':'tenho medo da prova','conflito':'bullying'};runtime.tutor.push({role:'bot',text:sayToTutor(options[button.dataset.feeling]||'odeio estudar')});renderChat();return;}case 'clear-chat':runtime.tutor=[{role:'bot',text:'Vamos recomeçar! Qual assunto você quer entender?'}];return render();
case 'consent-reopen':return acceptanceDialog();case 'receipt':return exportReceipt();case 'future-select':runtime.futureId=id;return render();case 'future-done':if(!state.doneFuture.includes(id)){state.doneFuture.push(id);save();toast('Missão registrada. Seu esforço conta!');}return render();case 'future-print':return window.print();case 'print':return window.print();case 'export':return exportData();case 'import':return $('#importFile').click();case 'reset':return resetConfirm();}}

function resetConfirm(){showModal('Apagar progresso?',`<p>Esta ação apaga o histórico de rodadas e missões deste navegador. Não existe recuperação, a menos que você tenha exportado um backup antes.</p><div class="buttons"><button class="btn warn" id="confirmReset">Sim, apagar meus dados</button><button class="btn outline" id="cancelReset">Cancelar</button></div>`);$('#confirmReset').onclick=()=>{state=emptyState();save();localAcceptance=null;try{localStorage.removeItem(CONTRACT_KEY);}catch(e){}hideModal(true);nav('inicio');acceptanceDialog();toast('Histórico e aceite local apagados.');};$('#cancelReset').onclick=hideModal;}
function qa(){
 let errors=[], ids=new Set(),prompts=new Set(),counts={};
 for(const l of LAB){
  counts[l.area]=(counts[l.area]||0)+1;
  if(ids.has(l.id))errors.push(`ID duplicado ${l.id}`);ids.add(l.id);
  for(const f of ['id','area','etapa','titulo','objetivo','previo','teoria','exemplo','pratica','aplicacao'])if(typeof l[f]!=='string'||!l[f].trim())errors.push(`${l.id}: campo ${f}`);
  if(!['Fundamental','Médio','Ambos'].includes(l.etapa))errors.push(`${l.id}: etapa não reconhecida`);
  if(!Array.isArray(l.passos)||l.passos.length<3||!Array.isArray(l.mapa)||l.mapa.length<6||!Array.isArray(l.cards)||l.cards.length<5||!Array.isArray(l.q)||l.q.length!==4)errors.push(`${l.id}: estrutura didática`);
  for(const [i,c] of (l.cards||[]).entries())if(!Array.isArray(c)||c.length!==2||c.some(x=>typeof x!=='string'||x.length<3))errors.push(`${l.id}: flashcard ${i}`);
  for(const [i,n] of (l.mapa||[]).entries())if(typeof n!=='string'||n.length<4)errors.push(`${l.id}: nó de mapa ${i}`);
  for(const [i,q] of (l.q||[]).entries()){
   if(!Array.isArray(q)||q.length!==5||!Array.isArray(q[1])||q[1].length!==4||new Set(q[1].map(x=>norm(String(x).trim()))).size!==4||!Number.isInteger(q[2])||q[2]<0||q[2]>3||![q[0],q[3],q[4]].every(x=>typeof x==='string'&&x.length>=5))errors.push(`${l.id}: questão ${i}`);
   const name=norm(String(q[0]||'')).trim();if(prompts.has(name))errors.push('enunciado repetido: '+q[0]);prompts.add(name);
  }
 }
 return {trilhas:LAB.length,questoes:LAB.reduce((n,l)=>n+l.q.length,0),flashcards:LAB.reduce((n,l)=>n+l.cards.length,0),mapas:LAB.length,missoes:FUT.length,porArea:counts,errors};
}

function importFile(file){if(!file)return; if(file.size>350000) {toast('Arquivo muito grande. Limite: 350 KB.');return;}let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(String(reader.result));if(!validState(v))throw Error('Estrutura do backup inválida.');state={...emptyState(),...v,attempts:v.attempts.slice(-500),doneFuture:[...new Set(v.doneFuture)]};save();nav('progresso');toast('Backup local restaurado.');}catch(e){toast('Não foi possível importar: arquivo inválido.');}};reader.onerror=()=>toast('Erro de leitura do arquivo.');reader.readAsText(file);}
document.addEventListener('click',e=>{const navButton=e.target.closest('[data-nav]');if(navButton){if(navButton.dataset.nav==='tutor'&& !runtime.topic)runtime.topic=lessons()[0]?.id;return nav(navButton.dataset.nav);}const button=e.target.closest('[data-action]');if(button)return action(button.dataset.action,button);});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='etapaHome'){state.etapa=el.value;state.area='Todas';save();render();}if(el.id==='mapSelect'){runtime.mapId=el.value;render();}if(el.id==='flashSelect'){runtime.topic=el.value;runtime.flashIndex=0;runtime.flipped=false;render();}if(el.id==='tutorTopic'){runtime.topic=el.value;}if(el.id==='importFile'){importFile(el.files[0]);el.value='';}});
document.addEventListener('input',e=>{if(e.target.id==='filterLessons'){let search=norm(e.target.value);$('#lessonList').innerHTML=lessons().filter(l=>norm([l.titulo,l.area,l.objetivo].join(' ')).includes(search)).map(cardLesson).join('')||'<div class="empty">Nenhuma trilha encontrada. Tente outro termo.</div>';}});
document.addEventListener('submit',e=>{if(e.target.id!=='chatForm')return;e.preventDefault();let input=$('#chatQuestion'),v=input.value.trim();if(!v)return;runtime.tutor.push({role:'user',text:v});runtime.tutor.push({role:'bot',text:sayToTutor(v)});if(runtime.tutor.length>24)runtime.tutor.splice(1,2);input.value='';renderChat();input.focus();});
$('#a11y').onclick=()=>{state.fontLarge=!state.fontLarge;save();render();toast(state.fontLarge?'Texto ampliado.':'Texto em tamanho padrão.');};
$('#ajudaTopo').onclick=()=>nav('documentos');$('#politicaFooter').onclick=()=>nav('documentos');$('#fechaModal').onclick=hideModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)hideModal();});
window.MRF_QA=qa;let audit=qa();if(audit.errors.length){console.error('Falhas estruturais na biblioteca',audit.errors);showModal('Verificação de biblioteca','Foram encontrados dados incompletos. Consulte o relatório QA antes de aplicar.');}
render();if(!localAcceptance)acceptanceDialog();
})();

</script>

<script id="lv-demo-mode">
(()=>{
 const APP="Meu Reforço Favorito";
 const BLOCK=["administração", "painel institucional", "painel do professor", "responsáveis", "licenciamento", "exportar", "exportação", "backup", "restaurar", "importar", "ranking", "comunidade", "relatórios", "relatorio", "auditoria", "qa /", "qa automatizado", "banco & backup", "gestão avançada", "configurações avançadas", "configuração avançada"];
 let timer;
 const norm=s=>(s||'').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
 const blocked=el=>{const t=norm(el.innerText||el.textContent||el.getAttribute('aria-label')||'');return BLOCK.some(w=>t.includes(norm(w)));};
 function notice(){let n=document.getElementById('lvDemoNotice');if(!n){n=document.createElement('div');n.id='lvDemoNotice';document.body.appendChild(n)}n.textContent='Recurso reservado à versão licenciada. Você está usando a demonstração gratuita de '+APP+'.';n.style.display='block';clearTimeout(timer);timer=setTimeout(()=>n.style.display='none',3200);}
 function init(){
  if(!document.getElementById('lvDemoRibbon')){const b=document.createElement('div');b.id='lvDemoRibbon';b.innerHTML='<strong>DEMONSTRAÇÃO GRATUITA</strong><span>'+APP+' · acesso a recursos selecionados</span><span>Versão completa disponível com licença individual.</span>';document.body.insertBefore(b,document.body.firstChild);}
  document.querySelectorAll('button,a,[role=button],[role=tab]').forEach(el=>{if(blocked(el)){el.classList.add('lv-demo-locked');el.dataset.lvDemoBlocked='1';el.setAttribute('aria-disabled','true');}});
 }
 document.addEventListener('click',e=>{const el=e.target.closest('button,a,[role=button],[role=tab]');if(el&&(el.dataset.lvDemoBlocked==='1'||blocked(el))){e.preventDefault();e.stopImmediatePropagation();notice();}},true);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
 new MutationObserver(init).observe(document.documentElement,{childList:true,subtree:true});
 window.LIMA_VIRTUAL_DEMO={active:true,app:APP,mode:'limited'};
})();
</script>
