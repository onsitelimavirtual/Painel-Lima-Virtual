name: Build DivulgaCerto 2.0 package
on:
  push:
    branches: [portfoliolimavirtual]
    paths:
      - 'DivulgaCerto-Android.html'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'termos.html'
      - 'privacidade.html'
      - 'styles.css'
      - 'divulgacerto-icon-512.png'
      - 'divulgacerto-marca.png'
      - 'divulgacerto-identidade.png'
      - 'analyzer_service.py'
      - 'requirements-analyzer.txt'
      - 'render.yaml'
      - 'supabase_schema.sql'
      - 'test_analyzer.py'
      - 'DEPLOY-RENDER-DIVULGACERTO.md'
      - '.github/workflows/build-divulgacerto.yml'
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble complete app package
        run: |
          mkdir -p DivulgaCerto_2.0/frontend DivulgaCerto_2.0/api DivulgaCerto_2.0/docs DivulgaCerto_2.0/tests DivulgaCerto_2.0/assets
          cp DivulgaCerto-Android.html config.js manifest.webmanifest sw.js termos.html privacidade.html DivulgaCerto_2.0/frontend/
          cp styles.css DivulgaCerto_2.0/frontend/ 2>/dev/null || true
          cp divulgacerto-icon-512.png divulgacerto-marca.png divulgacerto-identidade.png DivulgaCerto_2.0/assets/
          cp analyzer_service.py requirements-analyzer.txt render.yaml DivulgaCerto_2.0/api/
          cp supabase_schema.sql DEPLOY-RENDER-DIVULGACERTO.md DivulgaCerto_2.0/docs/
          cp test_analyzer.py DivulgaCerto_2.0/tests/
          cat > DivulgaCerto_2.0/LEIA-ME.txt <<'EOF'
DivulgaCerto 2.0 — pacote completo
==================================

FRONTEND
Abra frontend/DivulgaCerto-Android.html em servidor HTTPS ou localhost.
Para publicação estática, envie o conteúdo da pasta frontend para a raiz do site.
O login Google/Supabase e a análise de site/ZIP dependem de configuração e serviços externos.

API DE INTELIGÊNCIA
A pasta api contém analyzer_service.py, requirements-analyzer.txt e render.yaml.
Consulte docs/DEPLOY-RENDER-DIVULGACERTO.md para implantação no Render.

BANCO DE DADOS
docs/supabase_schema.sql é o esquema atualmente mantido no repositório. Confira sua compatibilidade com o código antes de executar em produção.

LIMITAÇÕES
- TikTok, YouTube, Instagram e sites/blogs têm fluxo de preparação/cópia; a publicação final é manual.
- A análise atual é heurística e não equivale a uma IA generativa.
- Termos e Política de Privacidade são minutas preliminares e precisam de revisão antes do lançamento.
- Não incluir chaves secretas ou service_role no frontend.
EOF
          cd DivulgaCerto_2.0 && zip -r ../DivulgaCerto_2.0_Completo_Atualizado.zip .
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivulgaCerto_2.0_Completo_Atualizado
          path: DivulgaCerto_2.0_Completo_Atualizado.zip
          if-no-files-found: error
          retention-days: 14
